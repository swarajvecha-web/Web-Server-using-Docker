services:
  # ==========================================
  # 1. Database Tier: MongoDB
  # ==========================================
  mongodb:
    container_name: mern-mongodb
    image: mongo:6.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: merndb
    volumes:
      - mongo_data:/data/db
    networks:
      - mern_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # 2. Backend API Tier: Node.js Express
  # ==========================================
  server:
    container_name: mern-server
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/merndb
      NODE_ENV: production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - mern_network
    expose:
      - "5000"

  # ==========================================
  # 3. Web Server & Frontend Tier: Nginx + React
  # ==========================================
  client:
    container_name: mern-client
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - mern_network

# Shared Isolated Bridge Network
networks:
  mern_network:
    driver: bridge

# Persistent Named Volumes
volumes:
  mongo_data:
    driver: local
